<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dactilología LSM - Reconocimiento de Abecedario Manual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <video id="videoInput" playsinline autoplay></video>
        <canvas id="outputCanvas"></canvas>
    </div>
    
    <div class="info-panel">
        <h3>📚 Abecedario LSM (Dactilología)</h3>
        <div class="abecedario-grid" id="abecedarioGrid"></div>
        <small class="help-text">
            🖐️ Muestra la letra con la mano • Presiona tecla A-Z para grabar • ESPACIO para separar • BACKSPACE para borrar • ESC para guardar
        </small>
    </div>

    <!-- Librerías externas -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
    
    <!-- Script principal -->
    <script src="script.js"></script>
</body>
</html>
